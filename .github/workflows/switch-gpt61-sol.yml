name: Switch Production Translator to GPT-6.1 Sol

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SERVER_HOST: ${{ secrets.IGN_DAILY_SERVER_HOST }}
      SERVER_PORT: ${{ secrets.IGN_DAILY_SERVER_PORT || '22' }}
      SERVER_USER: ${{ secrets.IGN_DAILY_SERVER_USER }}
      SERVER_PATH: ${{ secrets.IGN_DAILY_SERVER_PATH || '/srv/ign-daily' }}
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.IGN_DAILY_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY; do
            test -n "${!name:-}" || { echo "Missing required secret: $name" >&2; exit 2; }
          done
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/ign_daily_server_key
          chmod 600 ~/.ssh/ign_daily_server_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Probe model and switch runtime configuration
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -p "$SERVER_PORT" -i ~/.ssh/ign_daily_server_key "$SERVER_USER@$SERVER_HOST" \
            "bash -s -- '$SERVER_PATH'" <<'REMOTE'
          set -euo pipefail
          app="$(realpath -m "$1")"
          case "$app" in /srv/*) ;; *) echo 'Unsafe app path' >&2; exit 2;; esac
          exec 8>/var/lock/ign-daily-maintenance.lock
          flock -w 900 -x 8
          exec 9>/var/lock/ign-daily-write.lock
          flock -w 90 -x 9
          sudo APP_DIR="$app" python3 -B - <<'PY'
          import json, os, stat, sys, tempfile, urllib.request
          from pathlib import Path
          app = Path(os.environ['APP_DIR'])
          sys.path.insert(0, str(app / 'scripts'))
          from api_provider import is_openai_reasoning_model, chat_completions_endpoint
          target = 'gpt-6.1-sol'
          assert is_openai_reasoning_model(target), 'Deployed request adapter does not support GPT-6.1'
          config_path, env_path = app / 'data/automation-config.json', app / '.env'
          original_config = config_path.read_text(encoding='utf-8-sig')
          original_env = env_path.read_text(encoding='utf-8-sig')
          config = json.loads(original_config)
          model_keys = ('api_model', 'api_title_model', 'api_fulltext_model')
          assert all(config.get(k) in {'gpt-6-sol', target} for k in model_keys), 'Unexpected live model configuration'
          base = str(config.get('api_base_url') or '').rstrip('/')
          assert base == 'https://api.apikey.fan/v1', 'Unexpected live API endpoint'
          values = {}
          for line in original_env.splitlines():
              if line.strip() and not line.lstrip().startswith('#') and '=' in line:
                  key, value = line.split('=', 1)
                  values[key.strip()] = value.strip().strip('"').strip("'")
          key = values.get('TRANSLATOR_API_KEY')
          assert key, 'Server translator key is missing'
          payload = {'model': target, 'reasoning_effort': 'low', 'max_completion_tokens': 1024,
                     'stream': False, 'response_format': {'type': 'json_object'},
                     'messages': [{'role': 'user', 'content': 'Reply only with JSON: {"ok":true}'}]}
          request = urllib.request.Request(chat_completions_endpoint(base),
              data=json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  result = json.loads(response.read().decode())
          except Exception as exc:
              raise SystemExit('Model probe failed: ' + type(exc).__name__ + ' ' + str(getattr(exc, 'code', '')))
          returned_model = str(result.get('model') or '')
          assert returned_model.casefold() == target, 'Relay returned a different or missing model identifier'
          assert json.loads(result['choices'][0]['message']['content']).get('ok') is True, 'Unexpected probe output'
          print(json.dumps({'probe': 'ok', 'requested_model': target, 'response_model': returned_model, 'reasoning_effort': 'low'}))
          for name in model_keys:
              config[name] = target
          config['api_title_thinking'] = config['api_fulltext_thinking'] = 'low'
          for item in config.get('api_models', []):
              if item.get('model') == 'gpt-6-sol':
                  item.update(model=target, label='GPT-6.1 Sol (APIKEY.FAN external API)')
          config['updated_at'] = '2026-10-08T00:00:00.000Z'
          config['notes'] = 'Production uses APIKEY.FAN with GPT-6.1 Sol at low reasoning. Keys remain in server secrets.'
          lines = original_env.splitlines()
          lines = [line for line in lines if line.split('=', 1)[0].strip() != 'TRANSLATOR_MODEL']
          lines.append('TRANSLATOR_MODEL=' + target)
          def atomic_write(path, content):
              info = path.stat()
              fd, temp = tempfile.mkstemp(prefix=path.name + '.model-', dir=path.parent)
              try:
                  os.fchmod(fd, stat.S_IMODE(info.st_mode))
                  os.fchown(fd, info.st_uid, info.st_gid)
                  with os.fdopen(fd, 'w', encoding='utf-8') as output:
                      output.write(content)
                      output.flush()
                      os.fsync(output.fileno())
                  os.replace(temp, path)
              finally:
                  Path(temp).unlink(missing_ok=True)
          atomic_write(env_path, '\n'.join(lines) + '\n')
          try:
              atomic_write(config_path, json.dumps(config, ensure_ascii=False, indent=2) + '\n')
          except Exception:
              atomic_write(env_path, original_env)
              raise
          live = json.loads(config_path.read_text(encoding='utf-8'))
          print(json.dumps({k: live[k] for k in (*model_keys, 'api_title_thinking', 'api_fulltext_thinking')}))
          PY
          REMOTE
