name: Switch Production Translator to GPT-6 Sol

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVER_HOST: ${{ secrets.IGN_DAILY_SERVER_HOST }}
      SERVER_PORT: ${{ secrets.IGN_DAILY_SERVER_PORT || '22' }}
      SERVER_USER: ${{ secrets.IGN_DAILY_SERVER_USER }}
      SERVER_PATH: ${{ secrets.IGN_DAILY_SERVER_PATH || '/srv/ign-daily' }}
    steps:
      - name: Check server connection settings
        env:
          SERVER_SSH_KEY: ${{ secrets.IGN_DAILY_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY; do
            test -n "${!name:-}" || { echo "Missing required server secret: $name" >&2; exit 2; }
          done

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.IGN_DAILY_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/ign_daily_server_key
          chmod 600 ~/.ssh/ign_daily_server_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Probe relay and update production settings
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -p "$SERVER_PORT" -i ~/.ssh/ign_daily_server_key "$SERVER_USER@$SERVER_HOST" \
            "bash -s -- '$SERVER_PATH' '$SERVER_USER'" <<'REMOTE'
          set -euo pipefail
          app="$(realpath -m "$1")"
          user="$2"
          case "$app" in /srv/*) ;; *) echo 'Unsafe app path' >&2; exit 2;; esac
          exec 8>/var/lock/ign-daily-maintenance.lock
          flock -w 900 -x 8
          exec 9>/var/lock/ign-daily-write.lock
          flock -w 90 -x 9
          sudo APP_DIR="$app" python3 -B "$app/server_api/deploy/switch_terra_to_sol.py"
          APP_DIR="$app" python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads((Path(os.environ['APP_DIR']) / 'data/automation-config.json').read_text(encoding='utf-8-sig'))
          print(json.dumps({k: config.get(k) for k in (
              'api_model', 'api_title_model', 'api_fulltext_model',
              'api_title_thinking', 'api_fulltext_thinking', 'api_base_url')}, ensure_ascii=False))
          PY
          REMOTE
