name: Verify Deployed Faithful API Without Article Writes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SERVER_HOST: ${{ secrets.IGN_DAILY_SERVER_HOST }}
      SERVER_PORT: ${{ secrets.IGN_DAILY_SERVER_PORT || '22' }}
      SERVER_USER: ${{ secrets.IGN_DAILY_SERVER_USER }}
      SERVER_PATH: ${{ secrets.IGN_DAILY_SERVER_PATH || '/srv/ign-daily' }}
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.IGN_DAILY_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/server_key
          chmod 600 ~/.ssh/server_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: One synthetic translation using deployed prompt
        run: |
          set -euo pipefail
          ssh -p "$SERVER_PORT" -i ~/.ssh/server_key "$SERVER_USER@$SERVER_HOST" "bash -s -- '$SERVER_PATH'" <<'REMOTE'
          set -euo pipefail
          source /srv/ign-daily-ops/config-env.sh
          cd "$1"
          load_automation_config
          export TRANSLATOR_BASE_URL="$API_BASE_URL"
          export TRANSLATOR_MODEL="$API_FULLTEXT_MODEL"
          export TRANSLATOR_REASONING_EFFORT="$API_FULLTEXT_THINKING"
          "$PY" -B - <<'PY'
          import json, os, sys, urllib.request
          sys.path.insert(0, 'scripts')
          import translate_fulltext_api as api
          from api_provider import resolve_api_key
          from api_translation_prompt import PROMPT_VERSION
          api.load_env_file()
          source = [
              "Example Studio says its unannounced game may launch in 2027. The studio has not confirmed a release date.",
              'It will cost $79.99 on Xbox Series S. Director Jane Doe said, "We are still testing."',
          ]
          article = {"id": 1, "url": "https://example.test/synthetic-verification", "en_title": "Example Studio says its game may launch in 2027"}
          terms = api.matched_terms(article["en_title"] + "\n" + "\n".join(source), article=article)
          messages = api.build_messages(article, source, terms)
          assert len(messages[0]["content"]) < 1000
          assert "style_profile" not in json.loads(messages[1]["content"])
          raw, usage = api.call_deepseek_response(resolve_api_key(os.environ["TRANSLATOR_BASE_URL"]), os.environ["TRANSLATOR_MODEL"], os.environ["TRANSLATOR_BASE_URL"], messages, max_tokens=4096)
          data = api.normalize_translation(article, api.extract_json(raw), source)
          assert len(data["paragraphs"]) == 2
          assert "Jane Doe" in data["paragraphs"][1]["cn"]
          assert "人民币" not in data["paragraphs"][1]["cn"]
          assert "Series S" in data["paragraphs"][1]["cn"]
          print(json.dumps({"verified": True, "prompt_version": PROMPT_VERSION, "model": os.environ["TRANSLATOR_MODEL"], "reasoning_effort": os.environ["TRANSLATOR_REASONING_EFFORT"], "system_chars": len(messages[0]["content"]), "sample": data["paragraphs"]}, ensure_ascii=False))
          with urllib.request.urlopen("http://127.0.0.1:8010/health", timeout=10) as health:
              print("API_HEALTH: " + str(health.status))
          PY
          REMOTE
