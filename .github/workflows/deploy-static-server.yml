name: Deploy Static Server Mirror

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'exchange_rates.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ign-daily-static-server-deploy
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r server_api/requirements.txt
      - name: Run repository checks
        env:
          PYTHONPATH: scripts
          ALLOW_STALE_EXCHANGE_RATES: '1'
          IGN_DAILY_WRITE_LOCK: /tmp/ign-daily-ci-write.lock
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_*.py'
          python -m unittest discover -s server_api -p 'test_*.py'
          python scripts/test_miniprogram.py
          python scripts/agent_doctor.py
          node --test tests/*.test.cjs
          python tests/api-http-integration.py

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SERVER_HOST: ${{ secrets.IGN_DAILY_SERVER_HOST }}
      SERVER_PORT: ${{ secrets.IGN_DAILY_SERVER_PORT || '22' }}
      SERVER_USER: ${{ secrets.IGN_DAILY_SERVER_USER }}
      SERVER_PATH: ${{ secrets.IGN_DAILY_SERVER_PATH || '/srv/ign-daily' }}
      SERVER_API_PATH: ${{ secrets.IGN_DAILY_SERVER_API_PATH || '/srv/ign-daily-api' }}

    steps:
      - name: Check deployment secrets
        id: check
        env:
          SERVER_SSH_KEY: ${{ secrets.IGN_DAILY_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::notice::Missing GitHub Actions secret: IGN_DAILY_${name}; static server deployment will be skipped."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Package tracked site files
        if: steps.check.outputs.configured == 'true'
        run: python3 scripts/package_server_release.py /tmp/ign-daily-site.tar.gz

      - name: Configure SSH
        if: steps.check.outputs.configured == 'true'
        env:
          SERVER_SSH_KEY: ${{ secrets.IGN_DAILY_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/ign_daily_server_key
          chmod 600 ~/.ssh/ign_daily_server_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload package
        if: steps.check.outputs.configured == 'true'
        run: |
          set -euo pipefail
          scp -P "$SERVER_PORT" -i ~/.ssh/ign_daily_server_key \
            /tmp/ign-daily-site.tar.gz \
            "$SERVER_USER@$SERVER_HOST:/tmp/ign-daily-site-${GITHUB_SHA}.tar.gz"

      - name: Deploy code and dependencies with rollback
        if: steps.check.outputs.configured == 'true'
        run: |
          set -euo pipefail
          ssh -p "$SERVER_PORT" -i ~/.ssh/ign_daily_server_key "$SERVER_USER@$SERVER_HOST" \
            "bash -s -- '$GITHUB_SHA' '$SERVER_PATH' '$SERVER_API_PATH' '$SERVER_USER'" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          app="$2"
          api="$3"
          user="$4"
          archive="/tmp/ign-daily-site-$sha.tar.gz"
          stage="$(mktemp -d /tmp/ign-daily-deploy.XXXXXX)"
          trap 'rm -rf "$stage" "$archive"' EXIT
          tar -xzf "$archive" -C "$stage"
          for kind in write worker maintenance; do
            sudo touch "/var/lock/ign-daily-$kind.lock"
            sudo chown "$user:$user" "/var/lock/ign-daily-$kind.lock"
            sudo chmod 0664 "/var/lock/ign-daily-$kind.lock"
          done
          sudo APP_DIR="$app" API_DIR="$api" python3 "$stage/server_api/deploy/deploy_release.py" "$stage"
          REMOTE
