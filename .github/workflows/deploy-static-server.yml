name: Fill Latest Two Titles and Summaries
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  titles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ secrets.IGN_DAILY_SERVER_HOST }}
      SERVER_PORT: ${{ secrets.IGN_DAILY_SERVER_PORT || '22' }}
      SERVER_USER: ${{ secrets.IGN_DAILY_SERVER_USER }}
      SERVER_PATH: ${{ secrets.IGN_DAILY_SERVER_PATH || '/srv/ign-daily' }}
    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.IGN_DAILY_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/server_key
          chmod 600 ~/.ssh/server_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Translate only the latest two pending metadata records
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "$SERVER_PORT" -i ~/.ssh/server_key "$SERVER_USER@$SERVER_HOST" \
            "bash -s -- '$SERVER_PATH'" <<'REMOTE'
          set -euo pipefail
          source /srv/ign-daily-ops/config-env.sh
          cd "$1"
          exec 8>/var/lock/ign-daily-maintenance.lock
          flock -w 300 -s 8
          exec 7>/var/lock/ign-daily-worker.lock
          flock -w 300 -x 7
          load_automation_config
          export IGN_DAILY_WRITE_LOCK=/var/lock/ign-daily-write.lock
          export TRANSLATOR_BASE_URL="$API_BASE_URL"
          export TRANSLATOR_MODEL="$API_TITLE_MODEL"
          export TRANSLATOR_REASONING_EFFORT="$API_TITLE_THINKING"
          export TRANSLATOR_THINKING_MODE="$API_TITLE_THINKING"
          export TRANSLATOR_API_TIMEOUT_SECONDS=180
          export IGN_DAILY_SKIP_GIT=1
          "$PY" -B - <<'PY'
          import copy, json, sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import translate_titles_deepseek as title
          day=title.default_date()
          assert day=='2026-11-03', 'News day changed; refusing to process a different day'
          path=Path('data')/day
          before=title.load_json(path/'index.json')
          queue=title.load_json(path/'need_titles.json')
          assert len(before.get('articles',[]))==2, 'Latest list no longer has exactly two articles'
          assert len(queue)<=2, 'Unexpected queue size'
          target_urls={a['url'] for a in before['articles']}
          assert all(q.get('url') in target_urls for q in queue), 'Queue URL mismatch'
          for article in before['articles']:
              print('TARGET_SOURCE: '+json.dumps({'id':article['id'],'url':article['url'],'en_title':article.get('en_title'),'text':title.cached_article_text(day,article)},ensure_ascii=False),flush=True)
          count=title.translate_date(day,limit=2) if queue else 0
          expected_titles = {
              'https://www.ign.com/articles/dave-bautista-reveals-hes-gained-20-pounds-of-muscle-to-play-kratos-in-the-god-of-war-series': ('《战神》Dave Bautista称为出演奎托斯增肌约9公斤', '《战神》剧集奎托斯演员增肌9公斤'),
              'https://www.ign.com/articles/zach-cregger-was-frustrated-the-conversation-around-resident-evil-didnt-have-anything-to-do-with-the-movie': ('《生化危机》导演：影片讨论偏离电影本身', '《生化危机》导演：讨论偏离电影本身'),
          }
          with title.write_lock():
              latest=title.load_json(path/'index.json')
              for article in latest['articles']:
                  prior, concise = expected_titles[article['url']]
                  assert article['cn_title'] in (prior, concise), 'Title changed since review; preserve newer edits'
                  assert len(concise)<=20
                  article['cn_title']=concise
              title.write_json(path/'index.json', latest)
          after=title.load_json(path/'index.json')
          allowed={'cn_title','summary','category','emoji','pending_dict'}
          old={a['url']:a for a in before['articles']}
          for article in after['articles']:
              original=old[article['url']]
              assert {k:v for k,v in article.items() if k not in allowed}=={k:v for k,v in original.items() if k not in allowed}, 'Unexpected unrelated article field change'
              assert article.get('cn_title') and article.get('summary'), 'Metadata is still incomplete'
              print('TITLE_RESULT: '+json.dumps({k:article.get(k) for k in ('id','url','cn_title','summary','category','emoji')},ensure_ascii=False),flush=True)
          remaining=title.load_json(path/'need_titles.json')
          print('TITLE_SCOPE_COMPLETE: '+json.dumps({'news_day':day,'translated':count,'remaining':len(remaining)}),flush=True)
          assert not remaining, 'Some target titles remain queued'
          PY
          "$PY" -B scripts/enforce_dict_titles.py 2026-11-03
          REMOTE
