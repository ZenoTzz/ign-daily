name: Repair Production RSS Scheduler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ secrets.IGN_DAILY_SERVER_HOST }}
      SERVER_PORT: ${{ secrets.IGN_DAILY_SERVER_PORT || '22' }}
      SERVER_USER: ${{ secrets.IGN_DAILY_SERVER_USER }}
      SERVER_PATH: ${{ secrets.IGN_DAILY_SERVER_PATH || '/srv/ign-daily' }}
    steps:
      - name: Check repair secrets
        env:
          SERVER_SSH_KEY: ${{ secrets.IGN_DAILY_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY; do
            test -n "${!name:-}" || { echo "Missing required server secret: $name" >&2; exit 2; }
          done

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.IGN_DAILY_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/ign_daily_server_key
          chmod 600 ~/.ssh/ign_daily_server_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Repair cron and run RSS once
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -p "$SERVER_PORT" -i ~/.ssh/ign_daily_server_key "$SERVER_USER@$SERVER_HOST" \
            "bash -s -- '$SERVER_PATH' '$SERVER_USER'" <<'REMOTE'
          set -euo pipefail
          app="$(realpath -m "$1")"
          user="$2"
          case "$app" in /srv/*) ;; *) echo 'Unsafe app path' >&2; exit 2;; esac

          echo '=== BEFORE ==='
          date --iso-8601=seconds
          sudo systemctl is-active cron || true
          sudo -u "$user" crontab -l || true
          ps -eo pid=,etimes=,pgid=,args= | grep -E 'ign-daily-ops/run-(rss|api-translation)|scripts/(ign_rss_incremental|translate_titles_deepseek|translate_fulltext_api)\.py' | grep -v grep || true
          sudo tail -n 80 /var/log/ign-daily/rss.log 2>/dev/null || true

          sudo install -d -o "$user" -g "$user" -m 0755 /var/log/ign-daily
          sudo touch /var/log/ign-daily/rss.log
          sudo chown "$user:$user" /var/log/ign-daily/rss.log
          sudo chmod 0644 /var/log/ign-daily/rss.log
          test -f "$app/.env" || { echo 'Missing production .env' >&2; exit 2; }
          sudo chown "$user:$user" "$app/.env"
          sudo chmod 0600 "$app/.env"
          sudo -u "$user" test -r "$app/.env"
          sudo systemctl enable --now cron

          cron_tmp="$(mktemp)"
          trap 'rm -f "$cron_tmp"' EXIT
          sudo -u "$user" crontab -l 2>/dev/null | grep -vF '/srv/ign-daily-ops/run-rss.sh' > "$cron_tmp" || true
          printf '%s\n' '17,47 * * * * /srv/ign-daily-ops/run-rss.sh >> /var/log/ign-daily/rss.log 2>&1' >> "$cron_tmp"
          sudo -u "$user" crontab "$cron_tmp"

          echo '=== MANUAL RSS RUN ==='
          sudo -u "$user" timeout 600 bash -lc 'source /srv/ign-daily-ops/config-env.sh; source "$APP_DIR/server_api/deploy/worker_locks.sh"; with_worker_lock; cd "$APP_DIR"; "$PY" scripts/ign_rss_incremental.py --lookback-days 2'

          echo '=== AFTER ==='
          sudo systemctl is-active cron
          sudo -u "$user" crontab -l
          stat -c 'rss_state_mtime=%y' "$app/ign_rss_new.json"
          APP_DIR="$app" python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          app = Path(os.environ['APP_DIR'])
          now = datetime.now(timezone(timedelta(hours=8)))
          day = (now - timedelta(days=1) if now.hour < 8 else now).date().isoformat()
          index = json.loads((app / 'data' / day / 'index.json').read_text(encoding='utf-8-sig'))
          items = index.get('articles', index) if isinstance(index, dict) else index
          print(json.dumps({'news_day': day, 'article_count': len(items)}, ensure_ascii=False))
          PY
          REMOTE
