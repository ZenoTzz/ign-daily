name: IGNDaily
options:
  bundleIdPrefix: com.zenot
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: '27V23KNM5P'
    CODE_SIGN_STYLE: Automatic
targets:
  IGNDaily:
    type: application
    platform: iOS
    sources:
      - path: IGNDaily
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenot.igndaily
        TARGETED_DEVICE_FAMILY: '1'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: IGN Daily
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  IGNDailyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IGNDailyTests
    dependencies:
      - target: IGNDaily
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  IGNDailyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: IGNDailyUITests
    dependencies:
      - target: IGNDaily
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  IGNDaily:
    build:
      targets:
        IGNDaily: all
    test:
      targets:
        - IGNDailyTests
        - IGNDailyUITests
